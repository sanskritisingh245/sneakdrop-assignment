<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sneaker Drop</title>
  <style>
    :root {
      --ink: #18181b;
      --muted: #71717a;
      --faint: #a1a1aa;
      --line: #e4e4e7;
      --soft: #f4f4f5;
      --bg: #fafafa;
      --good: #16a34a;
      --urgent: #dc2626;
      --s1: 8px;
      --s2: 16px;
      --s3: 24px;
      --s4: 32px;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--s3) var(--s2);
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    p, h1, h2 { margin: 0; }

    .card {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: var(--s3);
      padding: var(--s4);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
    }
    .group { display: flex; flex-direction: column; gap: var(--s1); }
    .row { display: flex; justify-content: space-between; align-items: center; gap: var(--s1); }
    .muted { font-size: 14px; color: var(--muted); }
    .num { font-variant-numeric: tabular-nums; }

    .account { padding-bottom: var(--s3); border-bottom: 1px solid var(--line); }
    .account input {
      width: 160px;
      padding: 6px 10px;
      font: inherit;
      font-size: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .account input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }

    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 { font-size: 28px; line-height: 1.2; letter-spacing: -0.02em; }

    .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
    .bar div { height: 100%; background: var(--ink); border-radius: 99px; transition: width 0.4s; }

    .state {
      display: flex;
      flex-direction: column;
      gap: var(--s2);
      padding: var(--s3);
      background: var(--soft);
      border-radius: var(--radius);
    }
    h2 { font-size: 18px; line-height: 1.3; }
    .clock { font-size: 32px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
    .urgent .clock { color: var(--urgent); }
    .urgent .bar div { background: var(--urgent); }
    .timer .bar div { transition: width 1s linear; }

    .notice {
      padding: 10px 12px;
      font-size: 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .notice:empty { display: none; }

    button {
      width: 100%;
      padding: 14px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--ink);
      border: 0;
      border-radius: var(--radius);
      cursor: pointer;
    }
    button:disabled { color: var(--muted); background: var(--line); cursor: default; }

    dialog {
      width: min(320px, calc(100% - var(--s4)));
      padding: var(--s4);
      text-align: center;
      border: 0;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgb(0 0 0 / 0.2);
    }
    dialog::backdrop { background: rgb(0 0 0 / 0.35); }
    dialog form { display: flex; flex-direction: column; align-items: center; gap: var(--s1); }
    .check {
      width: 48px;
      height: 48px;
      margin-bottom: var(--s1);
      display: grid;
      place-items: center;
      font-size: 22px;
      color: #fff;
      background: var(--good);
      border-radius: 50%;
    }
    dialog strong { font-size: 20px; }
    dialog button { margin-top: var(--s2); }
  </style>
</head>
<body>
  <main class="card">
    <div class="account row">
      <label for="user" class="muted">Shopping as</label>
      <input id="user" autocomplete="off">
    </div>

    <section class="group">
      <p class="eyebrow">Limited release</p>
      <h1>Sneaker Drop</h1>
    </section>

    <section class="group" aria-label="Stock">
      <p><strong id="left" class="num">–</strong> of <span id="total" class="num">–</span> pairs left</p>
      <div class="bar"><div id="stock-bar"></div></div>
    </section>

    <section id="state" class="state">
      <div class="group">
        <h2 id="title">Loading...</h2>
        <p id="text" class="muted"></p>
      </div>
      <div id="timer" class="group timer" hidden>
        <p><span id="clock" class="clock num"></span> <span class="muted">left to pay</span></p>
        <div class="bar"><div id="timer-bar"></div></div>
      </div>
      <p id="notice" class="notice" role="status"></p>
      <button id="action" onclick="act(this.dataset.action)" hidden></button>
    </section>
  </main>

  <dialog id="paid">
    <form method="dialog">
      <div class="check" aria-hidden="true">✓</div>
      <strong>Payment successful</strong>
      <p class="muted">Your pair is confirmed.</p>
      <button>Done</button>
    </form>
  </dialog>

  <script>
    const HOLD_SECONDS = 300;
    const $ = (id) => document.getElementById(id);
    const user = () => $('user').value.trim();
    const clock = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    $('user').value = new URLSearchParams(location.search).get('user') ?? 'alice';
    let seen = { user: null, paid: 0, hold: false, position: null };
    let paying = false;
    let latest = 0;

    const errors = {
      sold_out: 'Just sold out. Join the waiting line instead.',
      already_holding: 'You already have a pair reserved.',
      limit_reached: "You've already bought the maximum number of pairs.",
      in_stock: 'A pair just became available. Buy it now.',
      no_active_hold: 'Your reservation has ended, so there is nothing to pay for.',
      'userId required': 'Enter your name at the top first.',
    };

    function view(s) {
      if (s.hold && paying) {
        return {
          title: 'Confirming your payment...',
          text: 'This usually takes a few seconds. Your pair stays reserved meanwhile.',
          button: ['', 'Processing payment...'],
        };
      }
      if (s.hold) {
        return {
          title: 'Your pair is reserved',
          text: 'Pay before the timer runs out, or the pair goes to the next person.',
          button: ['pay', 'Pay now'],
        };
      }
      if (s.paid >= s.maxPerUser) {
        return { title: "You're all set", text: `You've bought ${s.paid} pairs, the maximum per person.` };
      }
      if (s.position) {
        return {
          title: `You're #${s.position} in line`,
          text: "If a reserved pair isn't paid for in time, it's reserved for the next person in line automatically. Keep this page open.",
        };
      }
      if (s.available && s.paid) {
        return {
          title: 'Want another pair?',
          text: `You've bought ${s.paid} of ${s.maxPerUser}. Buying another reserves it for 5 minutes while you pay.`,
          button: ['buy', 'Buy another pair'],
        };
      }
      if (s.available) {
        return {
          title: 'Get your pair',
          text: 'Buying reserves a pair for you for 5 minutes while you pay.',
          button: ['buy', 'Buy now'],
        };
      }
      return {
        title: 'Sold out',
        text: "Join the waiting line. If someone doesn't pay in time, their pair goes to the next person in line.",
        button: ['waitlist', 'Join waiting line'],
      };
    }

    function render(s) {
      $('left').textContent = s.available;
      $('total').textContent = s.total;
      $('stock-bar').style.width = `${(s.available / s.total) * 100}%`;

      const v = view(s);
      $('title').textContent = v.title;
      $('text').textContent = v.text;

      $('timer').hidden = !s.hold;
      if (s.hold) {
        $('clock').textContent = clock(s.hold.secondsLeft);
        $('timer-bar').style.width = `${Math.min(1, s.hold.secondsLeft / HOLD_SECONDS) * 100}%`;
      }
      $('state').classList.toggle('urgent', !!s.hold && s.hold.secondsLeft < 60);

      $('action').hidden = !v.button;
      if (v.button) {
        const [path, label] = v.button;
        $('action').dataset.action = path;
        $('action').textContent = label;
        $('action').disabled = !path;
      }
    }

    async function refresh() {
      const id = ++latest;
      try {
        const name = user();
        const s = await (await fetch(`/status?userId=${encodeURIComponent(name)}`)).json();
        if (id !== latest) return;
        if (name !== seen.user) {
          seen = { user: name, paid: s.paid, hold: !!s.hold, position: s.position };
          paying = false;
          $('notice').textContent = '';
        }
        if (s.paid > seen.paid) {
          $('notice').textContent = '';
          if (!$('paid').open) $('paid').showModal();
        } else if (seen.hold && !s.hold) {
          $('notice').textContent = 'Your reservation expired and the pair was released.';
        } else if (seen.position && s.hold) {
          $('notice').textContent = 'Good news: a pair freed up and is now reserved for you.';
        }
        if (!s.hold) paying = false;
        seen = { user: name, paid: s.paid, hold: !!s.hold, position: s.position };
        render(s);
      } catch {
        $('notice').textContent = 'Connection lost. Retrying...';
      }
    }

    async function act(path) {
      $('action').disabled = true;
      try {
        const r = await fetch(`/${path}`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ userId: user() }),
        });
        const body = await r.json();
        $('notice').textContent = r.ok ? '' : errors[body.error] ?? 'Something went wrong. Try again.';
        if (r.ok && path === 'pay') paying = true;
      } catch {
        $('notice').textContent = 'Connection lost. Try again.';
      }
      refresh();
    }

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
